<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">PaddyLiteX — Efficient Paddy Leaf Disease Detection</title>
  <desc id="desc">Green and gold research banner. DenseLiteX, SPPF and C2PSA form a nine-class rice leaf detector. Reported proposed-model results: 81.67 percent mAP at IoU 0.5 and 2.88 million parameters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071f1c"/><stop offset=".65" stop-color="#103c32"/><stop offset="1" stop-color="#176149"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2eb882"/><stop offset="1" stop-color="#c0ed9b"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#69d3a4"/><stop offset="1" stop-color="#f3cf77"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b0eccb" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="26" fill="url(#grid)"/>
  <circle cx="1144" cy="200" r="212" fill="#88d998" fill-opacity=".035"/>
  <circle cx="1144" cy="200" r="152" fill="none" stroke="#a5e9c2" stroke-opacity=".09"/>
  <g font-family="Segoe UI,Arial,sans-serif">
