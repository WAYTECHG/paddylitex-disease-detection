    <circle cx="66" cy="48" r="4" fill="#f2d58c"/>
    <text x="80" y="53" fill="#d2e9d8" font-size="11" font-weight="600" letter-spacing="1.7">COMPUTER VISION · FYP RESEARCH</text>
    <text x="44" y="139" fill="#f6fbf3" font-size="72" font-weight="750" letter-spacing="-3">PaddyLite<tspan fill="#f3cf77">X</tspan></text>
    <text x="48" y="183" fill="#e2efe0" font-size="26" font-weight="500">Efficient paddy leaf disease detection.</text>
    <text x="49" y="219" fill="#a8c9bb" font-size="16">Dense feature reuse. Spatial pooling. Attention refinement.</text>
    <g font-size="12" font-weight="600" letter-spacing=".6">
      <rect x="49" y="246" width="127" height="31" rx="8" fill="#e6f9e9" fill-opacity=".075"/><text x="68" y="266" fill="#cae6d5">DenseLiteX</text>
      <path d="M185 262h19m-6-5 6 5-6 5" stroke="#8cb9a5" fill="none" stroke-width="1.5"/>
      <rect x="216" y="246" width="78" height="31" rx="8" fill="#e6f9e9" fill-opacity=".075"/><text x="237" y="266" fill="#cae6d5">SPPF</text>
      <path d="M303 262h19m-6-5 6 5-6 5" stroke="#8cb9a5" fill="none" stroke-width="1.5"/>
      <rect x="334" y="246" width="88" height="31" rx="8" fill="#f3cf77" fill-opacity=".12"/><text x="354" y="266" fill="#f5d990">C2PSA</text>
    </g>
    <path d="M49 302h655" stroke="#c6e3cc" stroke-opacity=".16"/>
    <g>
      <text x="49" y="345" fill="#f6fbf3" font-size="29" font-weight="700">81.67<tspan font-size="19" fill="#f3cf77">%</tspan></text>
      <text x="49" y="371" fill="#a8c9bb" font-size="11" letter-spacing="1.1">REPORTED mAP@0.5</text>
      <path d="M235 324v47" stroke="#c6e3cc" stroke-opacity=".16"/>
      <text x="267" y="345" fill="#f6fbf3" font-size="29" font-weight="700">2.88<tspan font-size="19" fill="#f3cf77">M</tspan></text>
      <text x="267" y="371" fill="#a8c9bb" font-size="11" letter-spacing="1.1">MODEL PARAMETERS</text>
      <path d="M461 324v47" stroke="#c6e3cc" stroke-opacity=".16"/>
      <text x="493" y="345" fill="#f6fbf3" font-size="29" font-weight="700">9<tspan font-size="19" fill="#f3cf77"> classes</tspan></text>
      <text x="493" y="371" fill="#a8c9bb" font-size="11" letter-spacing="1.1">BOUNDING-BOX DETECTION</text>
    </g>
